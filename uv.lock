[[package]]
name = "spotify-mute-ads"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "comtypes", marker = "sys_platform == 'win32'" },
    { name = "pycaw", marker = "sys_platform == 'win32'" },
    { name = "pywin32" },
]

[package.dev-dependencies]
build = [
    { name = "pyinstaller" },
]

[package.metadata]
requires-dist = [
    { name = "comtypes", marker = "sys_platform == 'win32'", specifier = ">=1.4" },
    { name = "pycaw", marker = "sys_platform == 'win32'", specifier = ">=20240210" },
    { name = "pywin32", specifier = ">=312" },
    { name = "pywin32", marker = "sys_platform == 'win32'", specifier = ">=306" },
]

[package.metadata.requires-dev]
build = [{ name = "pyinstaller", specifier = ">=6.0" }]
